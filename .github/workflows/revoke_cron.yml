name: Auto Revoke Expired Lockers

on:
  schedule:
    - cron: '0 * * * *' # تشغيل السكربت على رأس كل ساعة (دقيقة 0)
  workflow_dispatch: # هذا السطر يسمح لك بتشغيل السكربت يدوياً متى أردت للاختبار

jobs:
  check-lockers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Run Auto Revoke Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node auto_revoke.js
